name: Flutter Build Web and APK
on:
  push:
    branches: [ "main" ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем код
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Flutter (кеш включён для ускорения)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. Получаем зависимости
      - name: Install dependencies
        run: flutter pub get
      # 4. flutter create Web (результат появится в build/web)
      - name: Build Web
        run: flutter create .
      # 4. Собираем Web (результат появится в build/web)
      - name: Build Web
        run: flutter build web
      - name: Commit and Push build/web
        run: |
          git add build/web
          git commit -m "Auto-build: update build/web [skip ci]" || echo "No changes to commit"
          git push https://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@github.com/sergannn/flutter_web_workflow.git
   

      # 6. Собираем APK (результат появится в build/app/outputs/flutter-apk/)
